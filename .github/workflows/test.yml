name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate templates and index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on invalid template.json files and on an index.json that doesn't
      # match the templates, which QisPlay would otherwise serve as-is.
      - name: Check index.json
        run: npm run check

      - name: Compile lab files
        run: python3 -m compileall -q templates
