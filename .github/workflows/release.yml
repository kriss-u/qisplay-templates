# Push a tag like v1.2.0 to publish. QisPlay picks up the newest version tag
# through jsDelivr, so this only verifies the tag and refreshes jsDelivr's cache.
name: Release
on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-index.mjs --check
      - name: Refresh jsDelivr
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@latest/index.json" || true
          curl -fsS "https://data.jsdelivr.com/v1/packages/gh/${GITHUB_REPOSITORY}/resolved?specifier=latest" || true
